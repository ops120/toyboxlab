[glitch]
; 强度 0.1 ~ 1.0：决定竖线的条数、故障区宽度、泛色区多少
intensity = 0.6
; 刷新率（竖线基本静止，30 也完全够，更省 CPU）
fps = 60
; N 秒后自动恢复，0 = 一直花屏直到按退出键
duration = 0
; 启动后延迟 N 秒再出现（开机启动时建议 30~60，别一进桌面就花）
delay = 0
; 自定义退出键，多个用逗号分隔
;   支持修饰键：ctrl / alt / shift / win
;   单键：esc f8 space enter tab delete home end ... 字母 a-z、数字 0-9、f1-f24
;   示例：esc            f8            ctrl+shift+k        win+x
;   注意：Ctrl+Alt+Q 是硬编码的终极兜底，永远有效，防止把自己锁死
exit_keys = esc, ctrl+alt+q
; 启动后弹托盘气泡提示退出键（整蛊时建议关掉）
hint = true
; 开机启动。true = 每次登录自动运行（往"启动"文件夹放一个 VBS 启动器，不写注册表）。
; 程序每次启动都会把这里的值同步到系统，改完 ini 下次运行即生效。
autostart = true
